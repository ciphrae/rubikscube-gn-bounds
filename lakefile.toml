name = "rubiks_gn"
version = "0.1.0"
defaultTargets = ["RubiksGN"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "RubiksGN"
globs = ["RubiksGN", "RubiksGN.+"]

# Statement and proof for leanprover/comparator (see comparator.json). Not a default target.
[[lean_lib]]
name = "Comparator"
globs = ["Comparator.+"]
